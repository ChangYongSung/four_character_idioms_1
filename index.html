<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사자성어 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --paper: #f5efe3;
    --paper2: #ede5d0;
    --gold: #c8922a;
    --gold-light: #e8b84b;
    --red: #b03a2e;
    --green: #2d6a4f;
    --muted: #8a7a5a;
    --card: #faf6ee;
    --shadow: rgba(26,18,8,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(200,146,42,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 90%, rgba(176,58,46,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .grain {
    position: fixed;
    inset: 0;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
  }

  /* ── SCREENS ── */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px;
    z-index: 10;
    overflow-y: auto;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .screen-inner {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-height: min-content;
    transform-origin: top center;
  }
  .screen.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(16px);
  }

  /* ── HOME SCREEN ── */
  .home-wrap {
    width: 100%;
    max-width: 560px;
  }

  .logo-area {
    text-align: center;
    margin-bottom: 20px;
  }

  .logo-hanja {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(38px, 8vw, 64px);
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
    letter-spacing: 0.05em;
    text-shadow: 3px 3px 0 rgba(200,146,42,0.2);
    position: relative;
    display: inline-block;
  }
  .logo-hanja::after {
    content: '';
    display: block;
    width: 60%;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 12px auto 0;
  }

  .logo-sub {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: 0.15em;
  }

  .mode-cards {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .mode-card {
    background: var(--card);
    border: 1.5px solid var(--paper2);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 4px 20px var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }
  .mode-card::before {
    content: attr(data-icon);
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 48px;
    opacity: 0.12;
  }
  .mode-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px var(--shadow);
  }

  .mode-inline-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.05em;
    margin-right: 4px;
  }
  .mode-card h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .mode-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .mode-desc {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  /* Slider */
  .slider-wrap {
    margin-bottom: 20px;
  }
  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .slider-value {
    text-align: center;
    font-family: 'Noto Serif KR', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 10px;
    line-height: 1;
  }
  .slider-unit {
    font-size: 14px;
    color: var(--muted);
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--gold) 0%, var(--gold) 50%, var(--paper2) 50%, var(--paper2) 100%);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--gold);
    border: 3px solid var(--card);
    box-shadow: 0 2px 8px rgba(200,146,42,0.4);
    cursor: pointer;
    transition: transform 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--gold);
    border: 3px solid var(--card);
    cursor: pointer;
  }

  .btn-start {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-start-count {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: white;
    box-shadow: 0 4px 14px rgba(200,146,42,0.35);
  }
  .btn-start-time {
    background: linear-gradient(135deg, var(--red), #c0392b);
    color: white;
    box-shadow: 0 4px 14px rgba(176,58,46,0.35);
  }
  .btn-start:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
  }
  .btn-start:active {
    transform: translateY(0);
  }

  /* ── QUIZ SCREEN ── */
  .quiz-wrap {
    width: 100%;
    max-width: 560px;
  }

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .quiz-badge {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge-pill {
    background: var(--gold);
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 99px;
    letter-spacing: 0.05em;
  }
  .badge-progress {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    color: var(--muted);
  }

  .timer-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1.5px solid var(--paper2);
    border-radius: 10px;
    padding: 8px 14px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .timer-icon { font-size: 16px; }
  .timer-val {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    min-width: 52px;
    text-align: center;
    transition: color 0.3s;
  }
  .timer-val.urgent { color: var(--red); animation: pulse-red 0.6s infinite alternate; }

  @keyframes pulse-red {
    from { opacity: 1; }
    to { opacity: 0.6; }
  }

  .progress-bar-wrap {
    height: 5px;
    background: var(--paper2);
    border-radius: 3px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .question-card {
    background: var(--card);
    border: 1.5px solid var(--paper2);
    border-radius: 20px;
    padding: 32px 28px 24px;
    box-shadow: 0 6px 30px var(--shadow);
    margin-bottom: 20px;
    position: relative;
  }
  .question-num {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .question-type-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 3px 9px;
    border-radius: 99px;
    margin-bottom: 12px;
  }
  .type-meaning { background: rgba(200,146,42,0.12); color: var(--gold); }
  .type-example { background: rgba(45,106,79,0.12); color: var(--green); }

  .question-text {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 600;
    line-height: 1.7;
    color: var(--ink);
  }
  .question-hanja {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.05em;
  }

  .choices-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .choice-btn {
    background: var(--card);
    border: 1.5px solid var(--paper2);
    border-radius: 12px;
    padding: 16px 14px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(26,18,8,0.06);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
  }
  .choice-btn:hover:not(:disabled) {
    border-color: var(--gold);
    background: rgba(200,146,42,0.05);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(200,146,42,0.15);
  }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct {
    background: rgba(45,106,79,0.08);
    border-color: var(--green);
    color: var(--green);
  }
  .choice-btn.wrong {
    background: rgba(176,58,46,0.08);
    border-color: var(--red);
    color: var(--red);
  }
  .choice-letter {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--paper2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-top: 1px;
    transition: all 0.15s;
  }
  .choice-btn.correct .choice-letter { background: var(--green); color: white; }
  .choice-btn.wrong .choice-letter { background: var(--red); color: white; }
  .choice-btn:hover:not(:disabled) .choice-letter { background: var(--gold); color: white; }

  .feedback-msg {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    padding: 10px;
    border-radius: 8px;
    margin-top: 4px;
    min-height: 38px;
    transition: opacity 0.3s;
  }
  .feedback-msg.correct { color: var(--green); }
  .feedback-msg.wrong { color: var(--red); }

  /* Score strip */
  .score-strip {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 8px;
  }
  .score-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .score-chip strong {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    color: var(--ink);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-correct { background: var(--green); }
  .dot-wrong { background: var(--red); }

  /* ── RESULT SCREEN ── */
  .result-wrap {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  .result-trophy {
    font-size: 72px;
    margin-bottom: 16px;
    animation: trophy-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes trophy-pop {
    from { transform: scale(0) rotate(-15deg); opacity: 0; }
    to { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .result-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .result-subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .result-cards {
    display: flex;
    gap: 14px;
    margin-bottom: 32px;
    justify-content: center;
  }
  .result-card {
    flex: 1;
    max-width: 140px;
    background: var(--card);
    border: 1.5px solid var(--paper2);
    border-radius: 16px;
    padding: 20px 12px;
    box-shadow: 0 4px 16px var(--shadow);
  }
  .result-card-val {
    font-family: 'Noto Serif KR', serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 4px;
  }
  .result-card-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .result-rating {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 32px;
    line-height: 1.8;
  }
  .result-rating strong {
    color: var(--gold);
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
  }

  .btn-home {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 36px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: white;
    border: none;
    border-radius: 99px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(200,146,42,0.35);
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .btn-home:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(200,146,42,0.4);
    filter: brightness(1.06);
  }

  /* Correct flash overlay */
  .flash {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .flash.green { background: rgba(45,106,79,0.15); }
  .flash.red { background: rgba(176,58,46,0.12); }
  .flash.show { opacity: 1; }

  @media (max-width: 480px) {
    .choices-grid { grid-template-columns: 1fr; }
    .result-cards { flex-wrap: wrap; }
    .mode-card { padding: 20px; }
  }
</style>
</head>
<body>

<div class="grain"></div>
<div class="flash" id="flash"></div>

<!-- ══ HOME SCREEN ══ -->
<div class="screen" id="screen-home">
  <div class="screen-inner" id="inner-home">
  <div class="home-wrap">
    <div class="logo-area">
      <div class="logo-hanja">四字成語</div>
      <div class="logo-sub">사자성어 퀴즈</div>
    </div>

    <div class="mode-cards">
      <!-- MODE 1 : COUNT -->
      <div class="mode-card" data-icon="📚">
        <h2><span class="mode-inline-label">방식 1)</span> 정해진 개수 빨리 풀기</h2>
        <p class="mode-desc">문제 수를 정하고, 모두 맞히기까지 걸리는 시간을 겨룹니다.</p>
        <div class="slider-wrap">
          <div class="slider-value"><span id="count-val">20</span> <span class="slider-unit">문제</span></div>
          <div class="slider-labels">
            <span>15</span><span>20</span><span>25</span><span>30</span>
          </div>
          <input type="range" id="slider-count" min="0" max="3" step="1" value="1">
        </div>
        <button class="btn-start btn-start-count" onclick="startGame('count')">⏱ 시작하기</button>
      </div>

      <!-- MODE 2 : TIME -->
      <div class="mode-card" data-icon="⏳">
        <h2><span class="mode-inline-label">방식 2)</span> 정해진 시간 동안 많이 맞히기</h2>
        <p class="mode-desc">시간을 정하고, 제한 시간 안에 최대한 많은 문제를 맞힙니다.</p>
        <div class="slider-wrap">
          <div class="slider-value"><span id="time-val">2</span> <span class="slider-unit">분</span></div>
          <div class="slider-labels">
            <span>1분</span><span>2분</span><span>3분</span><span>4분</span><span>5분</span>
          </div>
          <input type="range" id="slider-time" min="1" max="5" step="1" value="2">
        </div>
        <button class="btn-start btn-start-time" onclick="startGame('time')">🏆 시작하기</button>
      </div>
    </div>
  </div>
  </div>
</div>

<!-- ══ QUIZ SCREEN ══ -->
<div class="screen hidden" id="screen-quiz">
  <div class="screen-inner" id="inner-quiz">
  <div class="quiz-wrap">
    <div class="quiz-header">
      <div class="quiz-badge">
        <span class="badge-pill" id="quiz-mode-badge">COUNT</span>
        <span class="badge-progress" id="quiz-progress">1 / 20</span>
      </div>
      <div class="timer-box">
        <span class="timer-icon">⏱</span>
        <span class="timer-val" id="timer-display">00:00</span>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>

    <div class="question-card">
      <div class="question-num" id="question-num">문제 1</div>
      <span class="question-type-badge" id="question-type-badge">뜻 맞히기</span>
      <div class="question-text" id="question-text">질문이 표시됩니다.</div>
      <div class="question-hanja" id="question-hanja"></div>
    </div>

    <div class="choices-grid" id="choices-grid"></div>

    <div class="feedback-msg" id="feedback-msg"></div>

    <div class="score-strip">
      <div class="score-chip"><div class="dot dot-correct"></div> 정답 <strong id="score-correct">0</strong></div>
      <div class="score-chip"><div class="dot dot-wrong"></div> 오답 <strong id="score-wrong">0</strong></div>
    </div>
  </div>
  </div>
</div>

<!-- ══ RESULT SCREEN ══ -->
<div class="screen hidden" id="screen-result">
  <div class="screen-inner" id="inner-result">
  <div class="result-wrap">
    <div class="result-trophy" id="result-trophy">🏆</div>
    <div class="result-title" id="result-title">결과</div>
    <div class="result-subtitle" id="result-subtitle">수고하셨습니다!</div>
    <div class="result-cards" id="result-cards"></div>
    <div class="result-rating" id="result-rating"></div>
    <button class="btn-home" onclick="goHome()">🏠 처음으로 돌아가기</button>
  </div>
  </div>
</div>

<script>
// ══ DATA ══
const DATA = [
  {word:"각골난망",hanja:"刻骨難忘",meaning:"남에게 입은 은혜가 뼈에 새길 만큼 커서 잊히지 않음을 뜻한다.",example:"베풀어 주신 은혜는 각골난망하여 평생 잊지 않겠다."},
  {word:"각양각색",hanja:"各樣各色",meaning:"여러 가지 모양과 여러 가지 색으로, 모든 것이 제각기 다름을 의미한다.",example:"축제 현장에는 각양각색의 옷을 입은 사람들이 모여들었다."},
  {word:"감언이설",hanja:"甘言利說",meaning:"달콤한 말과 이로운 조건으로 남을 꾀는 거짓말을 뜻한다.",example:"타인의 감언이설에 속아 재산을 탕진하는 일이 없어야 한다."},
  {word:"개과천선",hanja:"改過遷善",meaning:"지난날의 잘못을 고쳐 올바르고 착한 사람이 됨을 의미한다.",example:"그는 과거를 반성하고 개과천선하여 성실하게 살아가고 있다."},
  {word:"결초보은",hanja:"結草報恩",meaning:"죽어서도 은혜를 잊지 않고 반드시 갚음을 뜻한다.",example:"위기의 순간에 나를 구해준 친구에게 결초보은의 자세로 보답했다."},

// ══ SLIDER SETUP ══
const countValues = [15, 20, 25, 30];
const sliderCount = document.getElementById('slider-count');
const countVal = document.getElementById('count-val');
const sliderTime = document.getElementById('slider-time');
const timeVal = document.getElementById('time-val');

function updateSliderBg(el) {
  const min = +el.min, max = +el.max, val = +el.value;
  const pct = (val - min) / (max - min) * 100;
  el.style.background = `linear-gradient(to right, var(--gold) 0%, var(--gold) ${pct}%, var(--paper2) ${pct}%, var(--paper2) 100%)`;
}

sliderCount.addEventListener('input', () => {
  countVal.textContent = countValues[+sliderCount.value];
  updateSliderBg(sliderCount);
});
sliderTime.addEventListener('input', () => {
  timeVal.textContent = sliderTime.value;
  updateSliderBg(sliderTime);
});
updateSliderBg(sliderCount);
updateSliderBg(sliderTime);

// ══ GAME STATE ══
let gameMode, targetCount, targetSecs;
let questions = [];
let qIndex = 0;
let correctCount = 0, wrongCount = 0;
let startTime, timerInterval;
let gameActive = false;
let answered = false;

// ══ SCREEN NAV ══
const MIN_SCALE = 0.75;

function fitScreen(screenId) {
  const screen = document.getElementById(screenId);
  const inner = screen.querySelector('.screen-inner');
  if (!inner) return;

  // 스케일 초기화
  inner.style.transform = '';
  inner.style.marginTop = '';
  screen.style.overflowY = 'hidden';

  requestAnimationFrame(() => {
    const screenH = screen.clientHeight;
    const screenW = screen.clientWidth;
    const contentH = inner.scrollHeight;
    const contentW = inner.scrollWidth;

    const scaleH = screenH / contentH;
    const scaleW = screenW / contentW;
    const scale = Math.min(scaleH, scaleW, 1.0);

    if (scale >= MIN_SCALE) {
      // 방법2: 축소해서 꽉 맞게
      inner.style.transform = `scale(${scale})`;
      // 축소 후 세로 중앙 정렬
      const scaledH = contentH * scale;
      const margin = Math.max(0, (screenH - scaledH) / 2);
      inner.style.marginTop = margin + 'px';
      screen.style.overflowY = 'hidden';
    } else {
      // 방법1: 75%까지만 줄이고 스크롤
      inner.style.transform = `scale(${MIN_SCALE})`;
      inner.style.marginTop = '0px';
      inner.style.transformOrigin = 'top center';
      screen.style.overflowY = 'auto';
    }
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  const el = document.getElementById(id);
  el.classList.remove('hidden');
  // 다음 프레임에 fit 적용 (렌더링 후)
  requestAnimationFrame(() => fitScreen(id));
}

window.addEventListener('resize', () => {
  const active = document.querySelector('.screen:not(.hidden)');
  if (active) fitScreen(active.id);
});

function goHome() {
  clearInterval(timerInterval);
  gameActive = false;
  showScreen('screen-home');
}

// ══ SHUFFLE ══
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ══ START GAME ══
function startGame(mode) {
  gameMode = mode;
  targetCount = countValues[+sliderCount.value];
  targetSecs = +sliderTime.value * 60;

  questions = shuffle(DATA);
  if (mode === 'count') questions = questions.slice(0, targetCount);

  qIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  answered = false;
  gameActive = true;
  startTime = Date.now();

  document.getElementById('quiz-mode-badge').textContent = mode === 'count' ? '개수 모드' : '시간 모드';
  updateScoreDisplay();

  showScreen('screen-quiz');
  renderQuestion();
  startTimer();
}

// ══ TIMER ══
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!gameActive) return;
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const display = document.getElementById('timer-display');
    const tv = document.getElementById('timer-display');

    if (gameMode === 'count') {
      // Count up
      const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      display.textContent = `${m}:${s}`;
      display.classList.remove('urgent');
    } else {
      // Count down
      const remaining = Math.max(0, targetSecs - elapsed);
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      display.textContent = `${m}:${s}`;
      display.classList.toggle('urgent', remaining <= 10);
      if (remaining === 0) endGame();
    }
  }, 250);
}

// ══ RENDER QUESTION ══
function renderQuestion() {
  if (!gameActive) return;

  if (gameMode === 'count' && qIndex >= targetCount) { endGame(); return; }

  // Infinite pool for time mode
  let item;
  if (gameMode === 'count') {
    item = questions[qIndex];
  } else {
    item = shuffle(DATA)[0];
  }

  answered = false;

  // Question type: 50% meaning, 50% example
  const qType = Math.random() < 0.5 ? 'meaning' : 'example';

  let qText, qBadge;
  if (qType === 'meaning') {
    qText = `다음 뜻을 가진 사자성어는?<br><br>"${item.meaning}"`;
    qBadge = '뜻 맞히기';
  } else {
    const ex = item.example.replace(item.word, '___');
    qText = `빈칸에 알맞은 사자성어는?<br><br>"${ex}"`;
    qBadge = '예문 맞히기';
  }

  // Progress
  if (gameMode === 'count') {
    document.getElementById('quiz-progress').textContent = `${qIndex + 1} / ${targetCount}`;
    document.getElementById('question-num').textContent = `문제 ${qIndex + 1}`;
    const pct = (qIndex / targetCount) * 100;
    document.getElementById('progress-bar').style.width = pct + '%';
  } else {
    document.getElementById('quiz-progress').textContent = `${correctCount + wrongCount + 1}번째`;
    document.getElementById('question-num').textContent = `문제 ${correctCount + wrongCount + 1}`;
    document.getElementById('progress-bar').style.width = '0%';
  }

  document.getElementById('question-type-badge').textContent = qBadge;
  document.getElementById('question-type-badge').className = 'question-type-badge ' + (qType === 'meaning' ? 'type-meaning' : 'type-example');
  document.getElementById('question-text').innerHTML = qText;
  document.getElementById('question-hanja').textContent = '';
  document.getElementById('feedback-msg').textContent = '';
  document.getElementById('feedback-msg').className = 'feedback-msg';

  // Choices: 1 correct + 3 wrong
  const others = shuffle(DATA.filter(d => d.word !== item.word)).slice(0, 3);
  const choices = shuffle([item, ...others]);

  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  const letters = ['①', '②', '③', '④'];
  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-letter">${letters[i]}</span><span>${c.word}</span>`;
    btn.addEventListener('click', () => selectAnswer(btn, c.word === item.word, item));
    grid.appendChild(btn);
  });

  // Store correct item for reference
  grid.dataset.correctWord = item.word;
}

// ══ SELECT ANSWER ══
function selectAnswer(btn, isCorrect, item) {
  if (answered || !gameActive) return;
  answered = true;

  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => {
    b.disabled = true;
    if (b.querySelector('span:last-child').textContent === item.word) {
      b.classList.add('correct');
    }
  });

  if (!isCorrect) {
    btn.classList.add('wrong');
  }

  const fb = document.getElementById('feedback-msg');
  if (isCorrect) {
    correctCount++;
    fb.textContent = '✓ 정답입니다!';
    fb.className = 'feedback-msg correct';
    flashScreen('green');
  } else {
    wrongCount++;
    fb.textContent = `✗ 오답 — 정답: ${item.word} (${item.hanja})`;
    fb.className = 'feedback-msg wrong';
    flashScreen('red');
  }

  updateScoreDisplay();

  if (gameMode === 'count') qIndex++;

  setTimeout(() => {
    if (!gameActive) return;
    if (gameMode === 'count' && qIndex >= targetCount) { endGame(); return; }
    renderQuestion();
  }, 1000);
}

function flashScreen(color) {
  const el = document.getElementById('flash');
  el.className = `flash ${color} show`;
  setTimeout(() => el.classList.remove('show'), 150);
}

function updateScoreDisplay() {
  document.getElementById('score-correct').textContent = correctCount;
  document.getElementById('score-wrong').textContent = wrongCount;
}

// ══ END GAME ══
function endGame() {
  gameActive = false;
  clearInterval(timerInterval);

  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const total = correctCount + wrongCount;
  const accuracy = total > 0 ? Math.round(correctCount / total * 100) : 0;

  // Trophy & title
  let trophy, title, subtitle;
  if (gameMode === 'count') {
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    const weightMap = {15: 1.0, 20: 0.9, 25: 0.85, 30: 0.8};
    const weight = weightMap[targetCount] || 1.0;
    const secsPerQ = correctCount > 0 ? (elapsed / correctCount) * weight : 999;
    if (secsPerQ <= 3) { trophy = '🏆'; title = '전설의 실력!'; }
    else if (secsPerQ <= 5) { trophy = '🥇'; title = '훌륭해요!'; }
    else if (secsPerQ <= 8) { trophy = '🥈'; title = '잘했어요!'; }
    else { trophy = '📖'; title = '더 연습해봐요!'; }
    subtitle = `${targetCount}문제를 ${m}분 ${s}초 만에 풀었습니다.`;
  } else {
    const minutes = targetSecs / 60;
    const weightMap2 = {1: 1.0, 2: 0.9, 3: 0.8, 4: 0.7, 5: 0.6};
    const weight2 = weightMap2[minutes] || 1.0;
    const secsPerQ2 = correctCount > 0 ? (targetSecs / correctCount) * weight2 : 999;
    if (secsPerQ2 <= 3) { trophy = '🏆'; title = '전설의 실력!'; }
    else if (secsPerQ2 <= 5) { trophy = '🥇'; title = '훌륭해요!'; }
    else if (secsPerQ2 <= 8) { trophy = '🥈'; title = '잘했어요!'; }
    else { trophy = '📖'; title = '더 연습해봐요!'; }
    subtitle = `${minutes}분 동안 ${correctCount}개를 맞혔습니다.`;
  }

  document.getElementById('result-trophy').textContent = trophy;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-subtitle').textContent = subtitle;

  // Cards
  const cards = document.getElementById('result-cards');
  cards.innerHTML = '';
  if (gameMode === 'count') {
    const elapsed2 = Math.floor((Date.now() - startTime) / 1000);
    const m2 = Math.floor(elapsed / 60);
    const s2 = elapsed % 60;
    cards.innerHTML = `
      <div class="result-card"><div class="result-card-val">${m2}:${String(s2).padStart(2,'0')}</div><div class="result-card-label">걸린 시간</div></div>
      <div class="result-card"><div class="result-card-val">${correctCount}</div><div class="result-card-label">정답</div></div>
      <div class="result-card"><div class="result-card-val">${accuracy}%</div><div class="result-card-label">정확도</div></div>
    `;
  } else {
    cards.innerHTML = `
      <div class="result-card"><div class="result-card-val">${correctCount}</div><div class="result-card-label">맞힌 개수</div></div>
      <div class="result-card"><div class="result-card-val">${wrongCount}</div><div class="result-card-label">틀린 개수</div></div>
      <div class="result-card"><div class="result-card-val">${accuracy}%</div><div class="result-card-label">정확도</div></div>
    `;
  }

  // Rating message
  const ratings = ['📚 사자성어의 세계를 탐험 중!', '✏️ 열심히 배우고 있어요!', '⭐ 점점 늘고 있습니다!', '🌟 실력이 괄목상대하는군요!', '💫 거의 마스터했어요!', '🏅 사자성어 마스터!'];
  const ratingIdx = Math.min(Math.floor(accuracy / 20), 5);
  document.getElementById('result-rating').innerHTML = `<strong>${ratings[ratingIdx]}</strong><br>정답률 ${accuracy}% · ${total}문제 중 ${correctCount}개 정답`;

  showScreen('screen-result');
}
</script>
</body>
</html>
